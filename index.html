<!DOCTYPE html>
    <html>
        <head>
            <title>DOM Assignment</title>
            <script src="script.js" defer></script>
            <style>
                .color-box {
                    width: 150px;
                    height: 150px;
                    background-color: red;
                    margin: 20px;
                }
            </style>
        </head>
        <body>
            <h1>DOM Manipulation Practice</h1>
            
            <!-- Text Change Section -->
            <div>
                <p id="targetText">This text will change when you click the button.</p>
                <button id="textButton">Change Text</button>
            </div>

            <!-- Style Change Section -->
            <div>
                <div id="styleBox" class="color-box"></div>
                <button id="styleButton">Toggle Color</button>
            </div>

            <!-- Element Toggle Section -->
            <div>
                <div id="elementContainer"></div>
                <button id="elementButton">Add/Remove Element</button>
            </div>
        </body>
    </html>
